name: Download and Release OctopusVM IMGs & ISOs from Google Drive

on:
  workflow_dispatch

jobs:
  pre_build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Install Required Packages
      - run: sudo apt update && sudo apt install python3 && sudo apt install python3-pip && pip install gdown && sudo apt install p7zip
      - uses: actions/checkout@v2
      - name: Create OctopusVM Folder
      - run: mkdir OctopusVM
      - uses: actions/checkout@v2
      - name: Download & Unzip Windows 7Lite x64
      - run: cd OctopusVM && gdown https://drive.google.com/uc?id=1I7R20dyf9uN7lk_uljHSTwd65oo6nC89 && 7z x *.7z && sudo rm -rf *.7z
